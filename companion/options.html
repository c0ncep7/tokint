<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="icons/tokint-32.png"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TOKINT — IPFS shortcut</title><link rel="stylesheet" href="styles.css"><script type="module" src="ipfs-options.js"></script></head>
<body><main class="shell settings-shell"><header class="topbar"><div class="brand"><img class="brand-logo brand-art" src="icons/tokint-mark.svg" width="28" height="21" alt=""><img class="brand-wordmark brand-art" src="icons/tokint-wordmark.svg" width="106" height="13" alt="TOKINT"></div></header><h1 class="page-title">IPFS shortcut</h1><form id="connect-form" class="settings-card"><p class="settings-note">In tokint, open Settings and click Connect IPFS shortcut. Then confirm below.</p><label>tokint extension ID<input id="main-extension" required pattern="[a-p]{32}" spellcheck="false" autocomplete="off" readonly></label><div class="settings-actions"><button class="primary" type="submit">Connect</button></div><p id="connection-status" class="loading-status settings-note" role="status"></p></form></main></body></html>
